# iosextra - 手机端综合覆写（DNS / Tailscale / MITM / 等）
# 在 Stash/Clash Party 的 SubStore 中作为额外覆写使用
# 运行顺序：先跑主 override JS（mainline.min.js），再跑此 YAML
# jsDelivr: https://cdn.jsdelivr.net/gh/Zer0wAve/zer0plan@main/iosextra.yaml

# ===== 基础设置 =====
mode: rule
log-level: warning
# 保持 TCP 长连接的探活；Telegram 在 iOS 后台/网络切换后更容易发现失效会话并重连。
disable-keep-alive: false

# ===== DNS 配置（暂时注释，用 mainline.js 自带的）=====
# dns:
#   default-nameserver:
#     - 223.5.5.5
#     - 119.29.29.29
#   nameserver:
#     - 223.5.5.5
#     - 119.29.29.29
#     - system
#   fallback:
#     - https://dns.cloudflare.com/dns-query
#     - https://dns.google/dns-query
#   proxy-server-nameserver:
#     - https://dns.alidns.com/dns-query
#     - https://doh.pub/dns-query

# ===== 静态域名映射：已删除（2026-09）=====
# Stash 新版已原生支持 Tailscale MagicDNS，hululupc/ds224.hen-avior.ts.net
# 不再需要手工钉到 192.168.0.x，改由 MagicDNS 解析（→ 100.x tailnet 地址）。
# 勿再加回 hosts: —— 它会覆盖 MagicDNS 且只在 192.168.0.x 可达时才有意义。
# 注意：lan-relay 不撤（它解决的是「serve 只监听 tailnet 口」这个独立问题）。

# ===== 在 proxies 最前面插入 Tailscale 节点 =====
+proxies:
  - name: Homesweethome
    type: tailscale
    auth-key: ""
    ephemeral: false
    benchmark-url: http://192.168.0.1
    benchmark-timeout: 5
    benchmark-disabled: false

# ===== 新增 Homeland 代理组（隐藏，手动选择 Tailscale）=====
+proxy-groups:
  - name: Homeland
    type: select
    proxies:
      - Homesweethome
    hidden: true
  # 临时方案：Stash 内部某些机制/规则会把流量分流到 PROXY，
  # 配置中原本无此组，这里建立 PROXY 组直接接入 Final（MATCH 组），防止报错或漏流。
  - name: PROXY
    type: select
    proxies:
      - Final
    hidden: true

# ===== QUIC 屏蔽（Stash Script Shortcuts，比 AND 规则更高效）=====
script:
  shortcuts:
    quic: network == 'udp' and dst_port == 443

# ===== 在 rules 头部追加局域网直连规则 + QUIC 屏蔽 =====
+rules:
  - SCRIPT,quic,REJECT
  # 不再需要 DOMAIN-SUFFIX,hen-avior.ts.net 与 IP-CIDR,100.64.0.0/10：
  # Stash 现在原生识别 Tailscale，MagicDNS 域名与 CGNAT 地址会自动走 tailscale。
  # 家庭内网只有 192.168.0.0/24 这一个网段（PC .198 / NAS .224）。
  # 该网段不属于 tailnet，Stash 不会自动识别，故仍需显式规则。
  - IP-CIDR,192.168.0.0/24,Homeland
  # 【临时方案】metaaivm.com 在 Stash 上被判为 GEOIP [PRIVATE] 而走 DIRECT，
  # 实为 Stash 侧的处理问题（已由用户上报作者；该规则在 mihomo 上工作正常）。
  # 这里用显式域名规则兜住它（DOMAIN-SUFFIX 覆盖整棵子域树），
  # 排在 GEOIP,private 之前即可命中，不必等上游收录或 Stash 修复。
  # TODO(临时)：Stash 修复后可删除本条；仅存在于手机端 Stash 覆写，不影响桌面 mihomo。
  - DOMAIN-SUFFIX,metaaivm.com,AI服务
